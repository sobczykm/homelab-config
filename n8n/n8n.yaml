apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 8gears.container-registry.com/library
    chart: n8n
    targetRevision: 0.25.2
    helm:
      values: |
        replicaCount: 1
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-nginx
            kubernetes.io/ingress.class: nginx
            nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          hosts:
            - host: n8n.codebrew.cloud
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: n8n
                      port:
                        number: 5678
          tls:
            - secretName: n8n-tls
              hosts:
                - n8n.codebrew.cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true