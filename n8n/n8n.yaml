apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: n8n
spec:
  project: default
  source:
    repoURL: "https://helm.n8n.io/"
    chart: n8n
    targetRevision: "latest"
    helm:
      values: |
        replicaCount: 1
        ingress:
          enabled: true
          annotations:
            kubernetes.io/ingress.class: nginx
          hosts:
            - host: n8n.codebrew.cloud
              paths:
                - /
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
